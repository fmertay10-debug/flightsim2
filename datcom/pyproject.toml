[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pydatcom"
version = "0.2.0"
description = "USAF Digital DATCOM toolchain: deck generation, execution, parsing, and batch dataset generation for surrogate ML"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
test = ["pytest>=7"]
ml = ["scikit-learn>=1.3", "joblib>=1.3", "pandas>=2.0"]

[tool.setuptools]
packages = ["pydatcom"]
